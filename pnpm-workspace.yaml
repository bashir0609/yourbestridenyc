packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  next: 16.3.6
  eslint-config-next: 16.3.6
  react: 19.1.9
  react-dom: 19.1.9
  '@types/react': 19.1.16
  '@types/react-dom': 19.1.9
  tailwindcss: 4.1.12
  '@tailwindcss/postcss': 4.1.12
  zod: 3.25.76
  typescript: 5.9.2

# Both apps consume the same framework catalog. React is a workspace singleton.
# Keep Payload and every @payloadcms package on the same exact release.
overrides:
  react: 19.1.9
  react-dom: 19.1.9

onlyBuiltDependencies:
  - sharp
  - esbuild
  - '@tailwindcss/oxide'
